# ==============================================================================
# Service Desk - Dashboard Screen
# Power Apps Canvas App (YAML Code-First Format)
# ==============================================================================
# This screen is the main landing page showing KPIs, filters, and ticket list.
# Data source: SharePoint list "ServiceDeskTickets"
# ==============================================================================

Screen:
  Name: scrDashboard
  Fill: =App.Theme.Background  # #FAF9F8

  OnVisible: |
    =// Refresh ticket data when screen becomes visible
    Set(varLoadingDashboard, true);

    // Reload tickets collection for KPI calculations (non-delegable aggregates)
    ClearCollect(
        colAllTickets,
        ShowColumns(
            ServiceDeskTickets,
            "ID", "Title", "TicketID", "Status", "Priority",
            "Department", "Category", "AssignedTo", "CreatedBy",
            "Created", "SLADueDate", "ResolvedDate", "ClosedDate"
        )
    );

    // Calculate KPI values from local collection
    Set(
        varOpenCount,
        CountIf(
            colAllTickets,
            Status <> "Closed" && Status <> "Resolved"
        )
    );

    Set(
        varOverdueCount,
        CountIf(
            colAllTickets,
            SLADueDate < Now()
            && Status <> "Closed"
            && Status <> "Resolved"
        )
    );

    Set(
        varAvgResolutionHours,
        Round(
            Average(
                Filter(colAllTickets, !IsBlank(ResolvedDate)),
                DateDiff(Created, ResolvedDate, TimeUnit.Hours)
            ),
            1
        )
    );

    Set(
        varSLACompliancePct,
        If(
            CountIf(colAllTickets, !IsBlank(ResolvedDate)) = 0,
            100,
            Round(
                CountIf(
                    colAllTickets,
                    !IsBlank(ResolvedDate) && ResolvedDate <= SLADueDate
                )
                / CountIf(colAllTickets, !IsBlank(ResolvedDate))
                * 100,
                1
            )
        )
    );

    // Reset filters
    Set(varFilterDepartment, "All");
    Set(varFilterStatus, "All");
    Set(varFilterPriority, "All");
    Set(varSearchText, "");
    Set(varFilterDateFrom, Blank());
    Set(varFilterDateTo, Blank());

    Set(varLoadingDashboard, false);

  Children:

    # ==========================================================================
    # TOP BAR
    # ==========================================================================
    - Container:
        Name: conTopBar
        LayoutDirection: Horizontal
        X: 0
        Y: 0
        Width: =Parent.Width
        Height: 56
        Fill: =RGBA(0, 120, 212, 1)  # Primary #0078D4
        PaddingLeft: 20
        PaddingRight: 20

        Children:
          - Label:
              Name: lblAppTitle
              Text: ="Service Desk"
              X: 20
              Y: 0
              Width: 300
              Height: =Parent.Height
              Font: =Font.'Segoe UI'
              Size: 20
              FontWeight: =FontWeight.Bold
              Color: =RGBA(255, 255, 255, 1)
              VerticalAlign: =VerticalAlign.Middle

          - Container:
              Name: conTopBarRight
              LayoutDirection: Horizontal
              X: =Parent.Width - 160
              Y: 0
              Width: 140
              Height: =Parent.Height
              AlignInContainer: =AlignInContainer.End

              Children:
                - Button:
                    Name: btnNotification
                    Text: ""
                    Icon: =Icon.Bell
                    X: 0
                    Y: 8
                    Width: 40
                    Height: 40
                    Fill: =RGBA(0, 0, 0, 0)  # Transparent
                    Color: =RGBA(255, 255, 255, 1)
                    HoverFill: =RGBA(255, 255, 255, 0.15)
                    BorderStyle: =BorderStyle.None
                    OnSelect: =Navigate(scrNotifications, ScreenTransition.Fade)
                    Tooltip: ="Notifications"

                - Image:
                    Name: imgUserAvatar
                    Image: =User().Image
                    X: 56
                    Y: 8
                    Width: 40
                    Height: 40
                    ImagePosition: =ImagePosition.Fill
                    RadiusTopLeft: 20
                    RadiusTopRight: 20
                    RadiusBottomLeft: 20
                    RadiusBottomRight: 20
                    OnSelect: =Navigate(scrUserProfile, ScreenTransition.Fade)
                    Tooltip: =User().FullName

                - Label:
                    Name: lblUserInitials
                    # Fallback initials when avatar image unavailable
                    Text: |
                      =Upper(
                          Left(
                              First(Split(User().FullName, " ")).Value, 1
                          ) & Left(
                              Last(Split(User().FullName, " ")).Value, 1
                          )
                      )
                    X: 56
                    Y: 8
                    Width: 40
                    Height: 40
                    Visible: =IsBlankOrError(User().Image)
                    Fill: =RGBA(16, 110, 190, 1)  # Secondary #106EBE
                    Color: =RGBA(255, 255, 255, 1)
                    Font: =Font.'Segoe UI'
                    Size: 14
                    FontWeight: =FontWeight.Semibold
                    Align: =Align.Center
                    VerticalAlign: =VerticalAlign.Middle
                    RadiusTopLeft: 20
                    RadiusTopRight: 20
                    RadiusBottomLeft: 20
                    RadiusBottomRight: 20

    # ==========================================================================
    # KPI ROW
    # ==========================================================================
    - Container:
        Name: conKPIRow
        LayoutDirection: Horizontal
        X: 20
        Y: 76
        Width: =Parent.Width - 40
        Height: 110
        Gap: 16

        Children:
          # ---- Open Tickets KPI ----
          - Container:
              Name: conKPIOpen
              Width: =(Parent.Width - 48) / 4
              Height: =Parent.Height
              Fill: =RGBA(255, 255, 255, 1)  # Surface
              RadiusTopLeft: 8
              RadiusTopRight: 8
              RadiusBottomLeft: 8
              RadiusBottomRight: 8
              DropShadow: =DropShadow.Light
              PaddingLeft: 20
              PaddingTop: 16
              PaddingRight: 20
              PaddingBottom: 16

              Children:
                - Label:
                    Name: lblKPIOpenLabel
                    Text: ="Open Tickets"
                    Width: =Parent.Width - 40
                    Height: 24
                    Y: 12
                    Font: =Font.'Segoe UI'
                    Size: 12
                    Color: =RGBA(96, 94, 92, 1)  # TextSecondary
                    FontWeight: =FontWeight.Semibold
                    VerticalAlign: =VerticalAlign.Middle

                - Label:
                    Name: lblKPIOpenValue
                    Text: =If(varLoadingDashboard, "...", Text(varOpenCount))
                    Width: =Parent.Width - 40
                    Height: 44
                    Y: 38
                    Font: =Font.'Segoe UI'
                    Size: 32
                    Color: =RGBA(0, 120, 212, 1)  # Primary
                    FontWeight: =FontWeight.Bold
                    VerticalAlign: =VerticalAlign.Middle

                - Label:
                    Name: lblKPIOpenSubtext
                    Text: ="active requests"
                    Width: =Parent.Width - 40
                    Height: 20
                    Y: 80
                    Font: =Font.'Segoe UI'
                    Size: 10
                    Color: =RGBA(96, 94, 92, 1)
                    VerticalAlign: =VerticalAlign.Middle

          # ---- Overdue KPI ----
          - Container:
              Name: conKPIOverdue
              Width: =(Parent.Width - 48) / 4
              Height: =Parent.Height
              Fill: =RGBA(255, 255, 255, 1)
              RadiusTopLeft: 8
              RadiusTopRight: 8
              RadiusBottomLeft: 8
              RadiusBottomRight: 8
              DropShadow: =DropShadow.Light
              PaddingLeft: 20
              PaddingTop: 16
              PaddingRight: 20
              PaddingBottom: 16

              Children:
                - Label:
                    Name: lblKPIOverdueLabel
                    Text: ="Overdue"
                    Width: =Parent.Width - 40
                    Height: 24
                    Y: 12
                    Font: =Font.'Segoe UI'
                    Size: 12
                    Color: =RGBA(96, 94, 92, 1)
                    FontWeight: =FontWeight.Semibold

                - Label:
                    Name: lblKPIOverdueValue
                    Text: =If(varLoadingDashboard, "...", Text(varOverdueCount))
                    Width: =Parent.Width - 40
                    Height: 44
                    Y: 38
                    Font: =Font.'Segoe UI'
                    Size: 32
                    FontWeight: =FontWeight.Bold
                    # Red when overdue count > 0, otherwise normal text
                    Color: |
                      =If(
                          varOverdueCount > 0,
                          RGBA(216, 59, 1, 1),    // Danger #D83B01
                          RGBA(50, 49, 48, 1)      // Text #323130
                      )

                - Label:
                    Name: lblKPIOverdueSubtext
                    Text: ="past SLA deadline"
                    Width: =Parent.Width - 40
                    Height: 20
                    Y: 80
                    Font: =Font.'Segoe UI'
                    Size: 10
                    Color: |
                      =If(
                          varOverdueCount > 0,
                          RGBA(216, 59, 1, 1),
                          RGBA(96, 94, 92, 1)
                      )

          # ---- Avg Resolution Time KPI ----
          - Container:
              Name: conKPIAvgRes
              Width: =(Parent.Width - 48) / 4
              Height: =Parent.Height
              Fill: =RGBA(255, 255, 255, 1)
              RadiusTopLeft: 8
              RadiusTopRight: 8
              RadiusBottomLeft: 8
              RadiusBottomRight: 8
              DropShadow: =DropShadow.Light
              PaddingLeft: 20
              PaddingTop: 16
              PaddingRight: 20
              PaddingBottom: 16

              Children:
                - Label:
                    Name: lblKPIAvgResLabel
                    Text: ="Avg Resolution"
                    Width: =Parent.Width - 40
                    Height: 24
                    Y: 12
                    Font: =Font.'Segoe UI'
                    Size: 12
                    Color: =RGBA(96, 94, 92, 1)
                    FontWeight: =FontWeight.Semibold

                - Label:
                    Name: lblKPIAvgResValue
                    Text: |
                      =If(
                          varLoadingDashboard,
                          "...",
                          If(
                              IsBlank(varAvgResolutionHours) || IsError(varAvgResolutionHours),
                              "N/A",
                              If(
                                  varAvgResolutionHours >= 24,
                                  Text(Round(varAvgResolutionHours / 24, 1)) & "d",
                                  Text(varAvgResolutionHours) & "h"
                              )
                          )
                      )
                    Width: =Parent.Width - 40
                    Height: 44
                    Y: 38
                    Font: =Font.'Segoe UI'
                    Size: 32
                    Color: =RGBA(3, 131, 135, 1)  # Accent #038387
                    FontWeight: =FontWeight.Bold

                - Label:
                    Name: lblKPIAvgResSubtext
                    Text: ="time to resolve"
                    Width: =Parent.Width - 40
                    Height: 20
                    Y: 80
                    Font: =Font.'Segoe UI'
                    Size: 10
                    Color: =RGBA(96, 94, 92, 1)

          # ---- SLA Compliance KPI ----
          - Container:
              Name: conKPISLA
              Width: =(Parent.Width - 48) / 4
              Height: =Parent.Height
              Fill: =RGBA(255, 255, 255, 1)
              RadiusTopLeft: 8
              RadiusTopRight: 8
              RadiusBottomLeft: 8
              RadiusBottomRight: 8
              DropShadow: =DropShadow.Light
              PaddingLeft: 20
              PaddingTop: 16
              PaddingRight: 20
              PaddingBottom: 16

              Children:
                - Label:
                    Name: lblKPISLALabel
                    Text: ="SLA Compliance"
                    Width: =Parent.Width - 40
                    Height: 24
                    Y: 12
                    Font: =Font.'Segoe UI'
                    Size: 12
                    Color: =RGBA(96, 94, 92, 1)
                    FontWeight: =FontWeight.Semibold

                - Label:
                    Name: lblKPISLAValue
                    Text: =If(varLoadingDashboard, "...", Text(varSLACompliancePct) & "%")
                    Width: =Parent.Width - 40
                    Height: 44
                    Y: 38
                    Font: =Font.'Segoe UI'
                    Size: 32
                    FontWeight: =FontWeight.Bold
                    Color: |
                      =If(
                          varSLACompliancePct >= 90,
                          RGBA(16, 124, 16, 1),    // Success green
                          If(
                              varSLACompliancePct >= 75,
                              RGBA(255, 185, 0, 1), // Warning amber
                              RGBA(216, 59, 1, 1)   // Danger red
                          )
                      )

                - Label:
                    Name: lblKPISLASubtext
                    Text: ="on-time resolution"
                    Width: =Parent.Width - 40
                    Height: 20
                    Y: 80
                    Font: =Font.'Segoe UI'
                    Size: 10
                    Color: =RGBA(96, 94, 92, 1)

    # ==========================================================================
    # FILTER BAR
    # ==========================================================================
    - Container:
        Name: conFilterBar
        LayoutDirection: Horizontal
        X: 20
        Y: 202
        Width: =Parent.Width - 40
        Height: 56
        Fill: =RGBA(255, 255, 255, 1)
        RadiusTopLeft: 8
        RadiusTopRight: 8
        RadiusBottomLeft: 8
        RadiusBottomRight: 8
        DropShadow: =DropShadow.Light
        PaddingLeft: 16
        PaddingRight: 16
        Gap: 12
        AlignItems: =LayoutAlignItems.Center

        Children:
          - Dropdown:
              Name: ddlFilterDepartment
              Items: |
                =Ungroup(
                    Table(
                        { Value: "All" },
                        { Value: "IT" },
                        { Value: "HR" },
                        { Value: "Finance" },
                        { Value: "Facilities" },
                        { Value: "Legal" },
                        { Value: "Marketing" }
                    ),
                    "Value"
                )
              Default: ="All"
              Width: 150
              Height: 36
              OnChange: =Set(varFilterDepartment, Self.Selected.Value)
              BorderColor: =RGBA(210, 208, 206, 1)
              ChevronBackground: =RGBA(0, 120, 212, 1)
              Font: =Font.'Segoe UI'
              Size: 13

          - Dropdown:
              Name: ddlFilterStatus
              Items: |
                =Ungroup(
                    Table(
                        { Value: "All" },
                        { Value: "New" },
                        { Value: "Assigned" },
                        { Value: "In Progress" },
                        { Value: "Pending Requester" },
                        { Value: "Resolved" },
                        { Value: "Closed" }
                    ),
                    "Value"
                )
              Default: ="All"
              Width: 160
              Height: 36
              OnChange: =Set(varFilterStatus, Self.Selected.Value)
              BorderColor: =RGBA(210, 208, 206, 1)
              Font: =Font.'Segoe UI'
              Size: 13

          - Dropdown:
              Name: ddlFilterPriority
              Items: |
                =Ungroup(
                    Table(
                        { Value: "All" },
                        { Value: "Critical" },
                        { Value: "High" },
                        { Value: "Medium" },
                        { Value: "Low" }
                    ),
                    "Value"
                )
              Default: ="All"
              Width: 130
              Height: 36
              OnChange: =Set(varFilterPriority, Self.Selected.Value)
              BorderColor: =RGBA(210, 208, 206, 1)
              Font: =Font.'Segoe UI'
              Size: 13

          - DatePicker:
              Name: dpFilterDateFrom
              Width: 140
              Height: 36
              DefaultDate: =Blank()
              OnChange: =Set(varFilterDateFrom, Self.SelectedDate)
              Placeholder: ="From date"
              BorderColor: =RGBA(210, 208, 206, 1)
              Font: =Font.'Segoe UI'
              Size: 13

          - DatePicker:
              Name: dpFilterDateTo
              Width: 140
              Height: 36
              DefaultDate: =Blank()
              OnChange: =Set(varFilterDateTo, Self.SelectedDate)
              Placeholder: ="To date"
              BorderColor: =RGBA(210, 208, 206, 1)
              Font: =Font.'Segoe UI'
              Size: 13

          - TextInput:
              Name: txtSearch
              Width: =Parent.Width - 150 - 160 - 130 - 140 - 140 - 100 - (12 * 6) - 32
              Height: 36
              HintText: ="Search tickets by ID, title, or description..."
              OnChange: =Set(varSearchText, Self.Text)
              BorderColor: =RGBA(210, 208, 206, 1)
              FocusBorderColor: =RGBA(0, 120, 212, 1)
              Font: =Font.'Segoe UI'
              Size: 13
              Icon: =Icon.Search
              DelayOutput: true  # Debounce typing for performance

          - Button:
              Name: btnClearFilters
              Text: ="Clear"
              Width: 80
              Height: 36
              Fill: =RGBA(0, 0, 0, 0)
              Color: =RGBA(0, 120, 212, 1)
              HoverFill: =RGBA(0, 120, 212, 0.08)
              BorderStyle: =BorderStyle.None
              Font: =Font.'Segoe UI'
              Size: 13
              FontWeight: =FontWeight.Semibold
              OnSelect: |
                =Reset(ddlFilterDepartment);
                Reset(ddlFilterStatus);
                Reset(ddlFilterPriority);
                Reset(dpFilterDateFrom);
                Reset(dpFilterDateTo);
                Reset(txtSearch);
                Set(varFilterDepartment, "All");
                Set(varFilterStatus, "All");
                Set(varFilterPriority, "All");
                Set(varSearchText, "");
                Set(varFilterDateFrom, Blank());
                Set(varFilterDateTo, Blank());

    # ==========================================================================
    # TICKET LIST GALLERY
    # ==========================================================================
    - Gallery:
        Name: galTicketList
        TemplateSize: 72
        TemplatePadding: 4
        X: 20
        Y: 274
        Width: =Parent.Width - 40
        Height: =Parent.Height - 274 - 20
        ShowScrollbar: true
        LoadingSpinner: =LoadingSpinner.Data

        # ======================================================================
        # ITEMS PROPERTY - Delegation-friendly filtering against SharePoint
        # ======================================================================
        # SharePoint delegation supports: Filter, Sort, Search, =, <>, <, >, <=, >=
        # StartsWith is delegable; "in", exact-match on lookup columns are delegable.
        # We apply delegable filters directly, then layer non-delegable ones via
        # Search() on the local result. The 2000-row delegation limit applies.
        # ======================================================================
        Items: |
          =// Build delegable filter chain against SharePoint
          With(
              {
                  // Step 1: Apply delegable filters
                  filteredByDelegable:
                      Filter(
                          ServiceDeskTickets,
                          // Department filter (delegable equality)
                          (varFilterDepartment = "All" || Department = varFilterDepartment)
                          &&
                          // Status filter (delegable equality)
                          (varFilterStatus = "All" || Status = varFilterStatus)
                          &&
                          // Priority filter (delegable equality)
                          (varFilterPriority = "All" || Priority = varFilterPriority)
                          &&
                          // Date range filters (delegable comparison)
                          (IsBlank(varFilterDateFrom) || Created >= varFilterDateFrom)
                          &&
                          (IsBlank(varFilterDateTo) || Created <= DateAdd(varFilterDateTo, 1, TimeUnit.Days))
                      )
              },
              // Step 2: Apply search (non-delegable — runs on first 2000 rows)
              If(
                  IsBlank(varSearchText),
                  Sort(filteredByDelegable, Created, SortOrder.Descending),
                  Sort(
                      Search(filteredByDelegable, varSearchText, "Title", "TicketID"),
                      Created,
                      SortOrder.Descending
                  )
              )
          )

        TemplateChildren:
          # ---- Ticket Row Card ----
          - Container:
              Name: conTicketRow
              Width: =Parent.TemplateWidth - 8
              Height: 64
              X: 4
              Y: 4
              Fill: =RGBA(255, 255, 255, 1)
              RadiusTopLeft: 6
              RadiusTopRight: 6
              RadiusBottomLeft: 6
              RadiusBottomRight: 6
              DropShadow: =DropShadow.Light
              PaddingLeft: 16
              PaddingRight: 16
              OnSelect: |
                =Set(varSelectedTicketID, ThisItem.ID);
                Navigate(scrTicketDetail, ScreenTransition.Fade);

              Children:
                # Ticket ID — monospace
                - Label:
                    Name: lblGalTicketID
                    Text: =ThisItem.TicketID
                    X: 16
                    Y: 12
                    Width: 110
                    Height: 20
                    Font: =Font.'Courier New'
                    Size: 12
                    FontWeight: =FontWeight.Semibold
                    Color: =RGBA(50, 49, 48, 1)
                    VerticalAlign: =VerticalAlign.Middle

                # Title
                - Label:
                    Name: lblGalTitle
                    Text: =ThisItem.Title
                    X: 136
                    Y: 8
                    Width: =Parent.Width - 136 - 480
                    Height: 24
                    Font: =Font.'Segoe UI'
                    Size: 14
                    FontWeight: =FontWeight.Semibold
                    Color: =RGBA(50, 49, 48, 1)
                    VerticalAlign: =VerticalAlign.Middle
                    Overflow: =Overflow.Hidden

                # Department sub-label
                - Label:
                    Name: lblGalDepartment
                    Text: =ThisItem.Department & " / " & ThisItem.Category
                    X: 136
                    Y: 34
                    Width: =Parent.Width - 136 - 480
                    Height: 20
                    Font: =Font.'Segoe UI'
                    Size: 11
                    Color: =RGBA(96, 94, 92, 1)
                    VerticalAlign: =VerticalAlign.Middle

                # Status Pill
                - Button:
                    Name: btnGalStatusPill
                    Text: =ThisItem.Status
                    X: =Parent.Width - 460
                    Y: 16
                    Width: 120
                    Height: 28
                    RadiusTopLeft: 14
                    RadiusTopRight: 14
                    RadiusBottomLeft: 14
                    RadiusBottomRight: 14
                    Size: 11
                    FontWeight: =FontWeight.Semibold
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    DisplayMode: =DisplayMode.Disabled
                    DisabledColor: |
                      =If(
                          ThisItem.Status = "Pending Requester",
                          RGBA(50, 49, 48, 1),   // Dark text on amber
                          RGBA(255, 255, 255, 1)  // White text
                      )
                    DisabledFill: |
                      =Switch(
                          ThisItem.Status,
                          "New",                RGBA(0, 120, 212, 1),
                          "Assigned",           RGBA(3, 131, 135, 1),
                          "In Progress",        RGBA(202, 80, 16, 1),
                          "Pending Requester",  RGBA(255, 185, 0, 1),
                          "Resolved",           RGBA(16, 124, 16, 1),
                          "Closed",             RGBA(96, 94, 92, 1),
                          RGBA(210, 208, 206, 1)
                      )

                # Priority Pill
                - Button:
                    Name: btnGalPriorityPill
                    Text: =ThisItem.Priority
                    X: =Parent.Width - 330
                    Y: 16
                    Width: 80
                    Height: 28
                    RadiusTopLeft: 14
                    RadiusTopRight: 14
                    RadiusBottomLeft: 14
                    RadiusBottomRight: 14
                    Size: 11
                    FontWeight: =FontWeight.Semibold
                    DisplayMode: =DisplayMode.Disabled
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    DisabledColor: =RGBA(255, 255, 255, 1)
                    DisabledFill: |
                      =Switch(
                          ThisItem.Priority,
                          "Critical", RGBA(164, 38, 44, 1),   // #A4262C
                          "High",     RGBA(216, 59, 1, 1),    // #D83B01
                          "Medium",   RGBA(255, 185, 0, 1),   // #FFB900
                          "Low",      RGBA(16, 124, 16, 1),   // #107C10
                          RGBA(210, 208, 206, 1)
                      )

                # Assigned To avatar circle
                - Image:
                    Name: imgGalAssignee
                    Image: |
                      =If(
                          !IsBlank(ThisItem.AssignedTo),
                          Office365Users.UserPhotoV2(ThisItem.AssignedTo.Email),
                          Blank()
                      )
                    X: =Parent.Width - 230
                    Y: 14
                    Width: 32
                    Height: 32
                    ImagePosition: =ImagePosition.Fill
                    RadiusTopLeft: 16
                    RadiusTopRight: 16
                    RadiusBottomLeft: 16
                    RadiusBottomRight: 16
                    Visible: =!IsBlank(ThisItem.AssignedTo)

                - Label:
                    Name: lblGalAssigneeName
                    Text: |
                      =If(
                          IsBlank(ThisItem.AssignedTo),
                          "Unassigned",
                          ThisItem.AssignedTo.DisplayName
                      )
                    X: =Parent.Width - 192
                    Y: 16
                    Width: 100
                    Height: 28
                    Font: =Font.'Segoe UI'
                    Size: 12
                    Color: |
                      =If(
                          IsBlank(ThisItem.AssignedTo),
                          RGBA(164, 38, 44, 1),
                          RGBA(50, 49, 48, 1)
                      )
                    FontWeight: |
                      =If(
                          IsBlank(ThisItem.AssignedTo),
                          FontWeight.Semibold,
                          FontWeight.Normal
                      )
                    VerticalAlign: =VerticalAlign.Middle

                # SLA Due Date — conditional coloring
                - Label:
                    Name: lblGalSLADue
                    Text: |
                      =If(
                          IsBlank(ThisItem.SLADueDate),
                          "--",
                          If(
                              ThisItem.Status = "Closed" || ThisItem.Status = "Resolved",
                              Text(ThisItem.SLADueDate, "MMM dd"),
                              With(
                                  { hoursLeft: DateDiff(Now(), ThisItem.SLADueDate, TimeUnit.Hours) },
                                  If(
                                      hoursLeft < 0,
                                      "OVERDUE",
                                      If(
                                          hoursLeft < 4,
                                          Text(hoursLeft) & "h left",
                                          Text(ThisItem.SLADueDate, "MMM dd, hh:mm")
                                      )
                                  )
                              )
                          )
                      )
                    X: =Parent.Width - 90
                    Y: 16
                    Width: 80
                    Height: 28
                    Font: =Font.'Segoe UI'
                    Size: 11
                    FontWeight: =FontWeight.Semibold
                    Align: =Align.Right
                    VerticalAlign: =VerticalAlign.Middle
                    Color: |
                      =If(
                          ThisItem.Status = "Closed" || ThisItem.Status = "Resolved",
                          RGBA(96, 94, 92, 1),
                          With(
                              { hoursLeft: DateDiff(Now(), ThisItem.SLADueDate, TimeUnit.Hours) },
                              If(
                                  hoursLeft < 0,   RGBA(164, 38, 44, 1),  // Critical red — overdue
                                  hoursLeft < 4,   RGBA(216, 59, 1, 1),   // Danger — imminent
                                  hoursLeft < 24,  RGBA(255, 185, 0, 1),  // Warning — within 24h
                                  RGBA(96, 94, 92, 1)                      // Normal
                              )
                          )
                      )

    # ==========================================================================
    # FLOATING ACTION BUTTON — New Ticket
    # ==========================================================================
    - Button:
        Name: btnFABNewTicket
        Text: ="+ New Ticket"
        X: =Parent.Width - 200
        Y: =Parent.Height - 80
        Width: 160
        Height: 48
        RadiusTopLeft: 24
        RadiusTopRight: 24
        RadiusBottomLeft: 24
        RadiusBottomRight: 24
        Fill: =RGBA(0, 120, 212, 1)           # Primary
        HoverFill: =RGBA(16, 110, 190, 1)     # Secondary
        PressedFill: =RGBA(0, 90, 170, 1)
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        Size: 15
        FontWeight: =FontWeight.Bold
        BorderStyle: =BorderStyle.None
        DropShadow: =DropShadow.Bold
        OnSelect: =Navigate(scrSubmitTicket, ScreenTransition.Fade)
        Tooltip: ="Create a new support ticket"

    # ==========================================================================
    # LOADING OVERLAY
    # ==========================================================================
    - Container:
        Name: conLoadingOverlay
        Visible: =varLoadingDashboard
        X: 0
        Y: 0
        Width: =Parent.Width
        Height: =Parent.Height
        Fill: =RGBA(250, 249, 248, 0.8)

        Children:
          - Label:
              Name: lblLoadingText
              Text: ="Loading dashboard..."
              Width: 200
              Height: 40
              X: =(Parent.Width - 200) / 2
              Y: =(Parent.Height - 40) / 2
              Font: =Font.'Segoe UI'
              Size: 14
              Color: =RGBA(96, 94, 92, 1)
              Align: =Align.Center
              VerticalAlign: =VerticalAlign.Middle

    # ==========================================================================
    # EMPTY STATE
    # ==========================================================================
    - Container:
        Name: conEmptyState
        Visible: =CountRows(galTicketList.AllItems) = 0 && !varLoadingDashboard
        X: =(Parent.Width - 400) / 2
        Y: 380
        Width: 400
        Height: 200

        Children:
          - Label:
              Name: lblEmptyIcon
              Text: ="No tickets found"
              Width: 400
              Height: 40
              Y: 40
              Font: =Font.'Segoe UI'
              Size: 18
              Color: =RGBA(96, 94, 92, 1)
              FontWeight: =FontWeight.Semibold
              Align: =Align.Center

          - Label:
              Name: lblEmptySubtext
              Text: ="Try adjusting your filters or create a new ticket."
              Width: 400
              Height: 30
              Y: 80
              Font: =Font.'Segoe UI'
              Size: 13
              Color: =RGBA(96, 94, 92, 1)
              Align: =Align.Center

          - Button:
              Name: btnEmptyCreate
              Text: ="Create Ticket"
              Width: 160
              Height: 40
              X: 120
              Y: 130
              Fill: =RGBA(0, 120, 212, 1)
              Color: =RGBA(255, 255, 255, 1)
              RadiusTopLeft: 6
              RadiusTopRight: 6
              RadiusBottomLeft: 6
              RadiusBottomRight: 6
              BorderStyle: =BorderStyle.None
              Font: =Font.'Segoe UI'
              Size: 14
              FontWeight: =FontWeight.Semibold
              OnSelect: =Navigate(scrSubmitTicket, ScreenTransition.Fade)
